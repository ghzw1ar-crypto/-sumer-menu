<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sumer Menu - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,Tahoma,sans-serif;margin:0;background:#f5f5f5;color:#222}
.wrap{max-width:1000px;margin:auto;padding:16px}
.card{background:#fff;padding:18px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 12px #0001}
input,button{width:100%;padding:11px;margin:5px 0;border-radius:9px;border:1px solid #ddd;font-size:16px;box-sizing:border-box}
button{background:#111;color:#fff;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.danger{background:#b00020}.gray{background:#666}.green{background:#16833b}.orange{background:#a94f28}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid #eee;padding:12px;border-radius:12px;margin:10px 0;background:#fff}
.item img{width:70px;height:70px;object-fit:cover;float:right;margin-left:10px;border-radius:8px}
.clear{clear:both}
.hidden{display:none}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.top button{width:auto;padding:9px 14px}
.msg{margin-top:8px;font-weight:bold}
.success{color:#16833b}.error{color:#b00020}
.delivery-list{display:grid;gap:8px;margin-top:10px}
.delivery-item{display:flex;align-items:center;gap:8px;border:1px solid #eee;padding:10px;border-radius:12px;background:#fff}
.delivery-item .info{flex:1}.delivery-item .name{font-weight:800}
.delivery-item .fee{color:#666;font-size:14px;margin-top:3px}
.delivery-item button{width:auto;margin:0;padding:8px 12px}
@media(max-width:600px){
 .grid{grid-template-columns:1fr}
 .actions{grid-template-columns:1fr 1fr}
 .top{align-items:flex-start}
 .delivery-item{flex-wrap:wrap}
 .delivery-item .info{min-width:100%}
}
</style>
</head>
<body>
<div class="wrap">

<section id="login" class="card">
<h2>🍽️ Sumer Menu — تسجيل الدخول</h2>
<input id="email" type="email" autocomplete="username" placeholder="الإيميل">
<input id="password" type="password" autocomplete="current-password" placeholder="كلمة السر">
<button class="orange" id="loginBtn" onclick="login()">دخول</button>
<div id="loginMsg" class="msg"></div>
</section>

<section id="panel" class="hidden">
<div class="card top">
  <div>
    <h2 style="margin:0 0 5px">لوحة تحكم Sumer Menu</h2>
    <small>إدارة الأصناف ومناطق التوصيل من Supabase</small>
  </div>
  <button class="gray" onclick="logout()">خروج</button>
</div>

<div class="card">
<h3 id="title">➕ إضافة صنف</h3>
<input id="editId" type="hidden">
<div class="grid">
  <input id="name" placeholder="اسم الصنف">
  <input id="price" type="number" min="0" placeholder="السعر">
  <input id="category" placeholder="القسم">
  <input id="image_url" placeholder="رابط الصورة">
</div>
<label style="display:block;margin:8px 0">
  <input id="available" type="checkbox" checked style="width:auto;margin-left:6px">
  متوفر
</label>
<button class="green" onclick="save()">💾 حفظ</button>
<button class="gray" onclick="clearForm()">إلغاء</button>
<div id="msg" class="msg"></div>
</div>

<div class="card">
<h3>🚚 مناطق التوصيل</h3>
<p>أضف اسم المنطقة وأجور التوصيل. ستظهر المناطق للزبون داخل السلة.</p>
<div class="grid">
  <input id="deliveryName" placeholder="اسم المنطقة — مثال: حي سومر">
  <input id="deliveryFee" type="number" min="0" placeholder="أجور التوصيل بالدينار">
</div>
<button class="green" onclick="addDelivery()">➕ إضافة منطقة</button>
<div id="deliveryMsg" class="msg"></div>
<div id="deliveryList" class="delivery-list"></div>
</div>

<div class="card">
<div class="top">
  <h3 style="margin:0">📋 الأصناف</h3>
  <button class="orange" onclick="load()">تحديث</button>
</div>
<div id="count" style="margin-top:8px"></div>
<div id="items">جارٍ التحميل...</div>
</div>

</section>
</div>

<script>
const SUPABASE_URL="https://glbugvsorxtzixgexdak.supabase.co";
const SUPABASE_KEY="sb_publishable_8iv3CIQ3MaQ6E9oPgK6N8A_KTYGp-V6";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const DELIVERY_CATEGORY="__delivery_area__";

function $(id){return document.getElementById(id)}

function setMsg(id,text,type){
  const el=$(id);
  el.textContent=text||"";
  el.className="msg "+(type||"");
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m];
  });
}

async function login(){
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||!password){setMsg("loginMsg","❌ اكتب الإيميل وكلمة السر","error");return}
  $("loginBtn").disabled=true;
  setMsg("loginMsg","⏳ جاري تسجيل الدخول...");
  const {error}=await db.auth.signInWithPassword({email,password});
  $("loginBtn").disabled=false;
  if(error){setMsg("loginMsg","❌ "+error.message,"error");return}
  showPanel();
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

function showPanel(){
  $("login").classList.add("hidden");
  $("panel").classList.remove("hidden");
  load();
  loadDelivery();
}

async function load(){
  const box=$("items");
  box.textContent="⏳ جاري تحميل الأصناف...";
  const {data,error}=await db.from("menu_items")
    .select("*")
    .neq("category",DELIVERY_CATEGORY)
    .order("id");

  if(error){
    box.textContent="❌ "+error.message;
    return;
  }

  const rows=data||[];
  $("count").textContent="عدد الأصناف: "+rows.length;

  box.innerHTML=rows.map(function(x){
    const id=Number(x.id);
    return `
      <div class="item">
        ${x.image_url?`<img src="${esc(x.image_url)}" alt="">`:""}
        <b>${esc(x.name)}</b><br>
        💰 ${Number(x.price)||0} د.ع<br>
        📂 ${esc(x.category)}<br>
        ${x.available?"🟢 متوفر":"🔴 غير متوفر"}
        <div class="clear"></div>
        <div class="actions">
          <button class="orange" onclick="editById(${id})">✏️ تعديل</button>
          <button class="${x.available?"gray":"green"}" onclick="toggle(${id},${!!x.available})">
            ${x.available?"إيقاف":"تشغيل"}
          </button>
          <button class="danger" onclick="del(${id})">حذف</button>
        </div>
      </div>`;
  }).join("") || "<small>لا توجد أصناف.</small>";
}

/*
  الإصلاح الأساسي:
  زر التعديل لا يمرر اسم الصنف أو بياناته داخل onclick.
  يجلب الصنف مباشرة من Supabase باستخدام id.
  هذا يمنع مشاكل الأسماء العربية وعلامات الاقتباس والرموز.
*/
async function editById(id){
  setMsg("msg","⏳ جاري جلب بيانات الصنف...");
  const {data,error}=await db.from("menu_items").select("*").eq("id",id).maybeSingle();

  if(error){
    setMsg("msg","❌ "+error.message,"error");
    return;
  }
  if(!data){
    setMsg("msg","❌ لم يتم العثور على الصنف","error");
    return;
  }

  $("editId").value=data.id;
  $("name").value=data.name||"";
  $("price").value=data.price??"";
  $("category").value=data.category||"";
  $("image_url").value=data.image_url||"";
  $("available").checked=!!data.available;
  $("title").textContent="✏️ تعديل الصنف رقم "+data.id;
  setMsg("msg","✅ تم تحميل الصنف للتعديل","success");
  window.scrollTo({top:0,behavior:"smooth"});
}

function clearForm(){
  $("editId").value="";
  $("name").value="";
  $("price").value="";
  $("category").value="";
  $("image_url").value="";
  $("available").checked=true;
  $("title").textContent="➕ إضافة صنف";
  setMsg("msg","");
}

async function save(){
  const id=$("editId").value.trim();
  const name=$("name").value.trim();
  const priceText=$("price").value;
  const category=$("category").value.trim();
  const image_url=$("image_url").value.trim();
  const price=priceText===""?0:Number(priceText);

  if(!name){setMsg("msg","❌ اكتب اسم الصنف","error");return}
  if(!Number.isFinite(price)||price<0){setMsg("msg","❌ السعر غير صحيح","error");return}

  const obj={
    name:name,
    price:price,
    category:category,
    image_url:image_url,
    available:$("available").checked
  };

  setMsg("msg","⏳ جاري الحفظ...");

  const result=id
    ?await db.from("menu_items").update(obj).eq("id",id)
    :await db.from("menu_items").insert(obj);

  if(result.error){
    setMsg("msg","❌ "+result.error.message,"error");
    return;
  }

  setMsg("msg","✅ تم الحفظ بنجاح","success");
  clearForm();
  await load();
}

async function toggle(id,current){
  const result=await db.from("menu_items")
    .update({available:!current})
    .eq("id",id);

  if(result.error){
    alert("❌ "+result.error.message);
    return;
  }
  await load();
}

async function del(id){
  if(!confirm("متأكد من حذف الصنف؟"))return;

  const result=await db.from("menu_items")
    .delete()
    .eq("id",id);

  if(result.error){
    alert("❌ "+result.error.message);
    return;
  }
  await load();
}

async function loadDelivery(){
  const box=$("deliveryList");
  box.textContent="⏳ جاري تحميل المناطق...";

  const {data,error}=await db.from("menu_items")
    .select("*")
    .eq("category",DELIVERY_CATEGORY)
    .order("id");

  if(error){
    box.textContent="❌ "+error.message;
    return;
  }

  const rows=data||[];

  box.innerHTML=rows.map(function(x){
    const id=Number(x.id);
    return `
      <div class="delivery-item">
        <div class="info">
          <div class="name">${esc(x.name)}</div>
          <div class="fee">${Number(x.price)||0} د.ع</div>
        </div>
        <button class="gray" onclick="editDeliveryById(${id})">✏️ تعديل</button>
        <button class="danger" onclick="deleteDelivery(${id})">حذف</button>
      </div>`;
  }).join("") || "<small>لا توجد مناطق مضافة.</small>";
}

async function addDelivery(){
  const name=$("deliveryName").value.trim();
  const fee=Number($("deliveryFee").value);

  if(!name||!Number.isFinite(fee)||fee<0){
    alert("اكتب اسم المنطقة وأجور التوصيل");
    return;
  }

  const check=await db.from("menu_items")
    .select("id")
    .eq("category",DELIVERY_CATEGORY)
    .eq("name",name)
    .limit(1);

  if(check.error){
    alert("❌ "+check.error.message);
    return;
  }

  if(check.data&&check.data.length){
    alert("هذه المنطقة موجودة مسبقاً");
    return;
  }

  const result=await db.from("menu_items").insert({
    name:name,
    price:Math.round(fee),
    category:DELIVERY_CATEGORY,
    available:true
  });

  if(result.error){
    alert("❌ "+result.error.message);
    return;
  }

  $("deliveryName").value="";
  $("deliveryFee").value="";
  setMsg("deliveryMsg","✅ تم إضافة المنطقة","success");
  await loadDelivery();
}

async function editDeliveryById(id){
  const {data,error}=await db.from("menu_items")
    .select("*")
    .eq("id",id)
    .maybeSingle();

  if(error){alert("❌ "+error.message);return}
  if(!data){alert("❌ لم يتم العثور على المنطقة");return}

  const name=prompt("اسم المنطقة",data.name||"");
  if(name===null)return;

  const feeText=prompt("أجور التوصيل بالدينار",Number(data.price)||0);
  if(feeText===null)return;

  const fee=Number(feeText);

  if(!name.trim()||!Number.isFinite(fee)||fee<0){
    alert("البيانات غير صحيحة");
    return;
  }

  const result=await db.from("menu_items")
    .update({
      name:name.trim(),
      price:Math.round(fee),
      category:DELIVERY_CATEGORY,
      available:true
    })
    .eq("id",id);

  if(result.error){
    alert("❌ "+result.error.message);
    return;
  }

  await loadDelivery();
}

async function deleteDelivery(id){
  if(!confirm("حذف منطقة التوصيل؟"))return;

  const result=await db.from("menu_items")
    .delete()
    .eq("id",id);

  if(result.error){
    alert("❌ "+result.error.message);
    return;
  }

  await loadDelivery();
}

db.auth.getSession().then(function(result){
  if(result.data&&result.data.session)showPanel();
});
</script>
</body>
</html>
